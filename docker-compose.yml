services:
  db:
    image: mysql:8.0
    container_name: lft-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root123}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-lft_db}
      MYSQL_USER: ${MYSQL_USER:-lft_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-lft_pass123}
    # 只有在「需要从宿主机直连容器里的 MySQL」时才需要这条（GUI 客户端、宿主机跑 prisma）。
    # 但注意：若宿主机 3306 已被本机安装的 MySQL 占用，Docker 会静默跳过绑定——
    # 此时 docker inspect 的 HostConfig.PortBindings 仍显示配置，NetworkSettings.Ports 却是空的，
    # 端口能连通但连到的是本机那个 MySQL。判断实际状态要看 NetworkSettings.Ports。
    # 遇到冲突就改用 docker exec 访问，或把左侧换成一个没被占用的端口。
    # 部署时不需要这条，见 deploy/docker-compose.yml。
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: lft-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: mysql://${MYSQL_USER:-lft_user}:${MYSQL_PASSWORD:-lft_pass123}@db:3306/${MYSQL_DATABASE:-lft_db}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production-use-a-long-random-string}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost}
      ALLOW_TEACHER_SELF_REGISTER: ${ALLOW_TEACHER_SELF_REGISTER:-true}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-meta/llama-3.3-70b-instruct}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://integrate.api.nvidia.com}
      # 推理模型不关思考的话，一句话改写要 26 秒（实测 mimo-v2.5）。见 backend/api/lib/env.ts
      OPENAI_DISABLE_THINKING: ${OPENAI_DISABLE_THINKING:-true}
      NODE_ENV: production
      PORT: 3001
    # 本地开发需要发布到宿主机：vite dev 的 /api 代理指向 localhost:3001。
    # 容器内的前端 nginx 走服务名 backend:3001，不依赖这条映射。
    ports:
      - "3001:3001"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: lft-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  mysql-data:
